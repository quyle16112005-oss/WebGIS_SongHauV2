<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống WebGIS Giám Sát Thủy Sản Sông Hậu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-color: #0b131a;
            --panel-bg: rgba(16, 28, 38, 0.92);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-color: #e2e8f0;
            --accent-color: #2ec4b6;
            --active-color: #ff9f1c; 
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; }

        header { height: 50px; background: #070d12; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 2000; }
        header h1 { margin: 0; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #fff; }
        .nav-right { display: flex; gap: 15px; font-size: 13px; color: #a0aec0; align-items: center; }
        .nav-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px; border: 1px solid transparent; transition: all 0.2s; }
        .nav-btn:hover, .nav-btn.active { color: #fff; background: rgba(255,255,255,0.08); border-color: var(--border-color); }

        .main-container { display: flex; flex: 1; height: calc(100% - 50px); position: relative; }

        .sidebar-icons { width: 50px; background: #070d12; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 25px; z-index: 1000; }
        .sidebar-icons i { font-size: 18px; color: #718096; cursor: pointer; transition: color 0.3s; padding: 8px; border-radius: 6px; }
        .sidebar-icons i:hover, .sidebar-icons i.active { color: var(--accent-color); background: rgba(46, 196, 182, 0.1); }

        .control-panel { width: 340px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; z-index: 1000; backdrop-filter: blur(5px); }
        .control-panel::-webkit-scrollbar { width: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 10px; }
        
        .section-title { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 4px; }
        .action-btn { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .action-btn:hover { background: rgba(255,255,255,0.15); }
        .action-btn.active { background: var(--active-color); color: #000; font-weight: bold; border-color: var(--active-color); }
        .action-btn.tool-active { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a5568; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-color); }
        input:checked + .slider:before { transform: translateX(16px); }

        .range-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; margin: 2px 0; }

        .variable-list { font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .var-item { display: flex; justify-content: space-between; }
        .var-val { color: var(--accent-color); font-weight: bold; }

        .chart-box { background: rgba(0,0,0,0.25); border-radius: 6px; padding: 10px; border: 1px solid var(--border-color); }
        .chart-container { height: 78px; position: relative; margin-top: 4px; }

        #map { flex: 1; height: 100%; background-color: #0b131a; }

        .map-overlay-right { position: absolute; top: 15px; right: 15px; width: 320px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; z-index: 1000; font-size: 12px; backdrop-filter: blur(5px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .catch-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .catch-table th, .catch-table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .catch-table th { color: #718096; font-weight: normal; font-size: 11px; text-transform: uppercase; }
        .catch-table tr { cursor: pointer; transition: background 0.2s; }
        .catch-table tr:hover { background: rgba(255, 159, 28, 0.2); } 
        .catch-table tr.active-row { border-left: 3px solid var(--active-color); background: rgba(255, 159, 28, 0.15); }

        .map-legend { position: absolute; bottom: 20px; left: 410px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 15px; z-index: 1000; font-size: 11px; display: flex; flex-direction: column; gap: 8px; width: 260px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .legend-bar { height: 10px; background: linear-gradient(to right, #2ec4b6, #8ac926, #ffca3a, #ff595e); border-radius: 4px; }
        .legend-labels { display: flex; justify-content: space-between; color: #a0aec0; font-weight: bold; font-size: 10px; }
        
        .leaflet-popup-content-wrapper { background: var(--panel-bg) !important; color: var(--text-color) !important; border: 1px solid var(--border-color); box-shadow: 0 0 20px rgba(0,0,0,0.6); border-radius: 6px; padding: 0; }
        .leaflet-popup-tip { background: var(--panel-bg) !important; }
        .custom-popup { width: 230px; font-family: 'Segoe UI', sans-serif; }
        .custom-popup-header { background: rgba(255, 159, 28, 0.15); padding: 10px; border-bottom: 1px solid var(--border-color); border-top-left-radius: 6px; border-top-right-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; }
        .custom-popup-body { padding: 12px; font-size: 12px; line-height: 1.8; }
        .custom-popup-body .data-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 4px; }
        .custom-popup-body .data-label { color: #a0aec0; }
        .custom-popup-body .data-value { font-family: monospace; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-water" style="color: var(--active-color);"></i> WebGIS Giám Sát Thủy Sản Lưu Vực Sông Hậu</h1>
        <div class="nav-right">
            <span id="live-time" style="color: var(--active-color); font-weight: bold; margin-right: 10px; font-size: 13px;"></span>
            <span class="nav-btn" id="btnBasemap" title="Click để đổi nền bản đồ"><i class="fa-solid fa-layer-group"></i> Đổi Nền: Vệ Tinh</span>
            <span class="nav-btn" id="btnResetView" title="Quay về trung tâm sông Hậu"><i class="fa-solid fa-compress"></i> Toàn Cảnh Sông</span>
            <span class="nav-btn"><i class="fa-solid fa-user-tie"></i> Lê Gia Kiệt</span>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar-icons">
            <i class="fa-solid fa-house active" title="Trang chủ" onclick="resetMapView()"></i>
            <i class="fa-solid fa-temperature-half" title="Chế độ Nhiệt độ" onclick="switchMode('temp')"></i>
            <i class="fa-solid fa-wind" title="Chế độ Oxy hòa tan" onclick="switchMode('do')"></i>
            <i class="fa-solid fa-crosshairs" title="Đo nước tự do" onclick="toggleMeasureTool()"></i>
            <i class="fa-solid fa-gear" style="margin-top: auto; margin-bottom: 20px;"></i>
        </div>

        <div class="control-panel">
            <div>
                <div class="section-title">
                    Điều Khiển Lớp GIS 
                    <span id="model-status" style="color: var(--active-color); font-size: 11px;"><i class="fa-solid fa-satellite-dish"></i> Đang quét</span>
                </div>
                <div class="flex-row">
                    <span>Hiển thị Vùng nhiệt & Trạm cá</span>
                    <label class="switch"><input type="checkbox" id="toggleAI" checked><span class="slider"></span></label>
                </div>
                
                <div style="font-size: 12px; color: #a0aec0; margin-top: 6px;">Chế độ hiển thị Vùng nước (Polygon):</div>
                <div class="btn-group">
                    <button class="action-btn active" id="mode-temp" onclick="switchMode('temp')"><i class="fa-solid fa-temperature-high"></i> Nhiệt độ</button>
                    <button class="action-btn" id="mode-do" onclick="switchMode('do')"><i class="fa-solid fa-droplet"></i> Oxy (DO)</button>
                    <button class="action-btn" id="mode-tss" onclick="switchMode('tss')"><i class="fa-solid fa-smog"></i> Phù sa</button>
                </div>

                <div class="btn-group" style="margin-top: 6px;">
                    <button class="action-btn" id="btnMeasure" onclick="toggleMeasureTool()">
                        <i class="fa-solid fa-crosshairs"></i> Bật Click Bản Đồ Đo Nước Tự Do
                    </button>
                </div>

                <div style="margin-top: 10px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 5px; border: 1px dashed var(--border-color);">
                    <div style="font-size: 11px; color: var(--accent-color); font-weight: bold; margin-bottom: 4px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-arrows-up-down-left-right"></i> Vi Chỉnh Khớp Lòng Sông</span>
                        <span style="cursor:pointer; color:#ffca3a; text-decoration:underline;" onclick="resetOffsets()">Mặc định</span>

<html lang="vi">

    <title>Hệ Thống WebGIS Giám Sát Thủy Sản Sông Hậu</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #0b131a;
            --panel-bg: rgba(16, 28, 38, 0.92);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-color: #e2e8f0;
            --accent-color: #2ec4b6;
            --active-color: #ff9f1c; 
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; }

        header { height: 50px; background: #070d12; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 2000; }
        header h1 { margin: 0; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #fff; }
        .nav-right { display: flex; gap: 15px; font-size: 13px; color: #a0aec0; align-items: center; }
        .nav-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px; border: 1px solid transparent; transition: all 0.2s; }
        .nav-btn:hover, .nav-btn.active { color: #fff; background: rgba(255,255,255,0.08); border-color: var(--border-color); }

        .main-container { display: flex; flex: 1; height: calc(100% - 50px); position: relative; }

        .sidebar-icons { width: 50px; background: #070d12; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 25px; z-index: 1000; }
        .sidebar-icons i { font-size: 18px; color: #718096; cursor: pointer; transition: color 0.3s; padding: 8px; border-radius: 6px; }
        .sidebar-icons i:hover, .sidebar-icons i.active { color: var(--accent-color); background: rgba(46, 196, 182, 0.1); }

        .control-panel { width: 340px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; z-index: 1000; backdrop-filter: blur(5px); }
        .control-panel::-webkit-scrollbar { width: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 10px; }
        
        .section-title { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 4px; }
        .action-btn { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .action-btn:hover { background: rgba(255,255,255,0.15); }
        .action-btn.active { background: var(--active-color); color: #000; font-weight: bold; border-color: var(--active-color); }
        .action-btn.tool-active { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a5568; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-color); }
        input:checked + .slider:before { transform: translateX(16px); }

        .range-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; margin: 2px 0; }

        .variable-list { font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .var-item { display: flex; justify-content: space-between; }
        .var-val { color: var(--accent-color); font-weight: bold; }

        .chart-box { background: rgba(0,0,0,0.25); border-radius: 6px; padding: 10px; border: 1px solid var(--border-color); }
        .chart-container { height: 78px; position: relative; margin-top: 4px; }

        #map { flex: 1; height: 100%; background-color: #0b131a; }

        .map-overlay-right { position: absolute; top: 15px; right: 15px; width: 320px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; z-index: 1000; font-size: 12px; backdrop-filter: blur(5px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .catch-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
